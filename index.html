<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרטי האירוע</title>
<meta name="description" content="כמה דקות למילוי, וה-DJ מגיע מוכן לאירוע שלכם.">
<meta property="og:title" content="פרטי האירוע שלכם">
<meta property="og:description" content="כמה דקות למילוי, וה-DJ מגיע מוכן לאירוע שלכם.">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#17132B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317132B'/%3E%3Cg fill='%23FF3D6E'%3E%3Crect x='6' y='14' width='4' height='12' rx='2'/%3E%3Crect x='14' y='6' width='4' height='20' rx='2'/%3E%3Crect x='22' y='11' width='4' height='15' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17132B; --paper:#F4F3F8; --card:#FFFFFF; --line:#DAD6E8; --muted:#676082;
  --accent:#FF3D6E; --on-accent:#FFFFFF; --cue:#FFB020; --ok:#0E8A5F; --bad:#C8263F;
  --display:'Karantina','IBM Plex Sans Hebrew',sans-serif;
  --body:'IBM Plex Sans Hebrew',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:660px;margin:0 auto;padding:0 20px 120px}
.wrap.wide{max-width:900px}

/* brand */
.brand{display:flex;align-items:center;gap:12px}
.brand img{max-height:54px;max-width:190px;display:block}
.mark{display:flex;align-items:flex-end;gap:4px;height:34px}
.mark i{display:block;width:6px;border-radius:3px;background:var(--accent);transform-origin:bottom}
.mark i:nth-child(1){height:50%}.mark i:nth-child(2){height:100%}.mark i:nth-child(3){height:68%}.mark i:nth-child(4){height:36%}
.wordmark{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.01em}
.hero .mark{height:64px;gap:7px}.hero .mark i{width:11px;border-radius:6px}
.hero .wordmark{font-size:72px}
.hero .brand img{max-height:110px;max-width:260px}
@media (prefers-reduced-motion:no-preference){
  .hero .mark i{animation:eq 1.1s ease-in-out 3 alternate}
  .hero .mark i:nth-child(2){animation-delay:.15s}.hero .mark i:nth-child(3){animation-delay:.3s}.hero .mark i:nth-child(4){animation-delay:.45s}
}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.savestate{font-size:14px;color:var(--muted);white-space:nowrap}
.savestate.err{color:var(--bad)}

.hero{padding:28px 0 8px}
.hero h1{font-family:var(--display);font-weight:700;font-size:64px;line-height:.95;margin:26px 0 10px}
.hero p{margin:0;color:var(--muted);max-width:34em}

/* steps */
.steps{display:flex;gap:6px;margin:26px 0 8px;position:sticky;top:0;background:var(--paper);padding:10px 0;z-index:5}
.steps button{flex:1;border:0;background:none;padding:0;text-align:start;min-width:0}
.steps .bar{height:6px;border-radius:3px;background:var(--line);display:block}
.steps .on .bar{background:var(--accent)}
.steps .done .bar{background:var(--ink)}
.steps .nm{display:block;font-size:13px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .on .nm{color:var(--ink);font-weight:600}

h2{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;margin:26px 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
h3{font-size:17px;font-weight:600;margin:30px 0 10px}

.field{margin:0 0 18px}
.field label{display:block;font-size:15px;font-weight:500;margin-bottom:6px}
.field .hint{font-size:14px;color:var(--muted);margin-top:4px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px}
textarea{min-height:110px;resize:vertical}
input:disabled,textarea:disabled{background:transparent;color:var(--ink);opacity:.85}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.hero h1{font-size:52px}.hero .wordmark{font-size:56px}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-size:16px}
.chip.on{background:var(--ink);color:#fff}
.chip:disabled{opacity:.6;cursor:default}

.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:600;background:var(--ink);color:#fff;min-height:50px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.quiet{background:transparent;color:var(--muted);padding:10px 12px;min-height:0;font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:15px;border-radius:10px}
.nav{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:6}
.nav .in{max-width:660px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 auto}

/* songs */
.songlist{list-style:none;margin:10px 0 0;padding:0}
.songlist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.songlist img{width:42px;height:42px;border-radius:6px;flex:none;background:var(--line)}
.songlist .t{font-weight:500;display:block}
.songlist .a{font-size:14px;color:var(--muted);display:block}
.songlist .x{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 8px}
.results{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;margin-top:6px;overflow:hidden}
.results button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results img{width:38px;height:38px;border-radius:5px;flex:none}
.results .free{font-weight:500}
.no-list .t{text-decoration:line-through;text-decoration-color:var(--bad)}

/* timeline: the run sheet */
.tl{position:relative;margin:14px 0 0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.tl input[type=time]{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;padding:4px 8px;min-height:50px;border-color:transparent;background:transparent;direction:ltr;text-align:center}
.tl input[type=time]:focus,.tl input[type=time]:hover{border-color:var(--line);background:var(--card)}
.tl .ti{font-weight:600}
.tl .no{font-size:15px;min-height:42px;padding:8px 12px;margin-top:6px}
.tl .x{border:0;background:none;color:var(--muted);font-size:22px;padding:10px 6px}
.tlactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.banner{background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;margin:14px 0}
.banner.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.done-box{text-align:center;padding:40px 0}
.done-box h2{font-size:60px}

/* admin */
.evrow{display:grid;grid-template-columns:86px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.evrow .d{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;text-align:center}
.evrow .d small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.evrow .n{font-weight:600;font-size:18px;display:block}
.evrow .m{color:var(--muted);font-size:14px;display:block}
.st{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;white-space:nowrap;border:1.5px solid var(--line);color:var(--muted)}
.st.sub{background:var(--ok);border-color:var(--ok);color:#fff}
.st.prog{border-color:var(--cue);color:#8A5A00}
.st.lock{background:var(--ink);border-color:var(--ink);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.headrow{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.empty{padding:50px 0;color:var(--muted)}
.sw{display:flex;gap:12px;align-items:center;margin:0 0 16px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
input[type=color]{width:64px;height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:4px}

.toast{position:fixed;bottom:96px;inset-inline:0;margin:0 auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;font-weight:500}

/* booth */
.booth{position:fixed;inset:0;background:#0E0B1C;color:#F3F1FA;overflow:auto;z-index:40;padding:22px 26px 40px}
.booth .bh{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #2E2850;padding-bottom:14px}
.booth .clock{font-family:var(--display);font-weight:700;font-size:72px;line-height:.9;direction:ltr}
.booth .bn{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.booth .bm{color:#A9A2C9;font-size:16px}
.booth .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;margin-top:20px}
@media (max-width:820px){.booth .grid{grid-template-columns:1fr}.booth .clock{font-size:54px}.booth .bn{font-size:34px}}
.booth h4{font-size:15px;font-weight:600;color:#A9A2C9;margin:22px 0 8px}
.booth .bt{list-style:none;margin:0;padding:0}
.booth .bt li{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 12px;border-radius:12px;align-items:baseline}
.booth .bt .tm{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;direction:ltr;text-align:center;color:#A9A2C9}
.booth .bt .tt{font-size:22px;font-weight:600}
.booth .bt .tn{display:block;font-size:16px;font-weight:400;color:#A9A2C9}
.booth .bt li.past{opacity:.4}
.booth .bt li.now{background:var(--cue);color:#17132B}
.booth .bt li.now .tm,.booth .bt li.now .tn{color:#17132B}
.booth .bl{list-style:none;margin:0;padding:0}
.booth .bl li{padding:9px 0;border-bottom:1px solid #2E2850;font-size:18px}
.booth .bl small{color:#A9A2C9;display:block;font-size:14px}
.booth .bl.no li{color:#FF8098}
.booth .notes{white-space:pre-wrap;color:#D9D4EE}
.booth .btn{background:#2E2850}

.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end;margin:6px 0 20px}
.stars button{border:0;background:none;font-size:52px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--cue)}
.revbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.revbox .s{color:var(--cue);font-size:24px;letter-spacing:2px;direction:ltr;text-align:right}
.revbox p{margin:6px 0 4px;white-space:pre-wrap}
.revbox small{color:var(--muted)}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  #app,.toast{display:none!important}
  #print{display:block;font-size:12pt;color:#000}
  #print .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:6px}
  #print .ph img{max-height:60px;max-width:200px}
  #print h1{font-family:var(--display);font-size:44pt;line-height:1;margin:14px 0 4px}
  #print h2{font-family:var(--body);font-size:13pt;font-weight:600;margin:20px 0 6px;border-bottom:1px solid #999;padding-bottom:3px;break-after:avoid}
  #print .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
  #print .kv div b{font-weight:600}
  #print table{width:100%;border-collapse:collapse}
  #print td{padding:6px 4px;border-bottom:1px solid #ccc;vertical-align:top}
  #print td.tm{font-family:var(--display);font-weight:700;font-size:20pt;width:22mm;direction:ltr;text-align:center;line-height:1}
  #print ol,#print ul{margin:0;padding-inline-start:20px;columns:2}
  #print li{break-inside:avoid;margin-bottom:3px}
  #print .pre{white-space:pre-wrap}
  #print .wordmark{font-size:30pt}
  #print .mark i{background:#000;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  #print .foot{margin-top:24px;font-size:9pt;color:#555}
}
.land .hero h1{font-size:76px}.land .hero p{font-size:19px}
.lcta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 6px}
.lvid{display:block;width:100%;max-width:340px;aspect-ratio:9/16;margin:26px auto;border-radius:22px;background:#0A0A0B;box-shadow:0 24px 60px rgba(23,19,43,.25)}
.lsec{margin:10px 0 26px}.lf{padding:18px 0;border-top:1.5px solid var(--line)}
.lf h3{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0 0 6px}.lf p{margin:0;color:var(--muted)}
.lprice{background:var(--ink);color:#fff;border-radius:20px;padding:26px 22px;margin:0 0 26px}
.lprice h2{font-family:var(--display);font-size:54px;line-height:1;margin:0 0 4px;color:var(--cue)}
.lprice .big{font-size:24px;margin:0 0 8px}.lprice p{margin:0;color:#D9D5EA}
#join{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px 22px;scroll-margin-top:20px}
#join h2{font-family:var(--display);font-size:46px;line-height:1;margin:0 0 8px}
.land .hint{font-size:14px;color:var(--muted)}.land .ok{color:var(--ok);font-weight:600}.land .warn{color:var(--bad);font-weight:600}
.lfoot{font-size:14px;color:var(--muted);margin:26px 0 0}
.pavg{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:6px 0 4px}.pavg b{font-family:var(--display);font-size:72px;line-height:1}.pavg .s{color:var(--cue);font-size:30px;letter-spacing:2px}.pavg small{flex-basis:100%;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p style="padding-top:60px">טוען…</p></div></div>
<div id="print"></div>
<script>
'use strict';
const SUPA='https://vtuyhvbgcwlzwtjlnydb.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0dXlodmJnY3dsend0amxueWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2OTQ4OTgsImV4cCI6MjExMDI3MDg5OH0.Ws0SaVhGo1mpRa5bdNCprVSDoCfEfRK9586gYpctj3w';

async function rpc(fn,args){
  const r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&j.message)||'error');
  return j;
}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const TYPES=['חתונה','בר / בת מצווה','חינה','יום הולדת','אירוע חברה','אחר'];
const GENRES=['מזרחית','ים תיכונית','פופ ישראלי','להיטים לועזיים','היפ הופ','האוס / טכנו','רגאטון','שנות ה-80 וה-90','שנות ה-2000','חסידי / דתי','רוק','טראנס','אפרו','סלואו'];
const MOMENTS={
  'חתונה':['כניסת החתן לחופה','כניסת הכלה לחופה','שבירת הכוס','כניסה לרחבה','ריקוד ראשון'],
  'בר / בת מצווה':['כניסת חתן / כלת השמחה','ריקוד עם ההורים','מצגת או הדלקת נרות'],
  'חינה':['כניסה','טקס החינה'],
  'יום הולדת':['כניסה','עוגה וברכות'],
  'אירוע חברה':['פתיחה','נאומים או מצגת'],
  'אחר':['כניסה']
};
const PLAN={
  'חתונה':[[0,'קבלת פנים'],[75,'חופה'],[105,'כניסה לרחבה וריקוד ראשון'],[120,'מנה ראשונה'],[150,'סבב ריקודים ראשון'],[210,'מנה עיקרית'],[240,'סבב ריקודים שני']],
  'בר / בת מצווה':[[0,'קבלת פנים'],[60,'כניסת חתן / כלת השמחה'],[75,'מנה ראשונה'],[100,'סבב ריקודים ראשון'],[150,'מצגת וברכות'],[170,'מנה עיקרית'],[200,'סבב ריקודים שני']],
  '_':[[0,'קבלת פנים'],[45,'כניסה'],[60,'ארוחה'],[105,'ריקודים']]
};
const STEPS=['האירוע','מוזיקה','שירים','ציר זמן','סיכום'];
const MUST_MAX=10;
const okUrl=u=>/^https:\/\/[^\s"'<>]+$/.test(u||'');
function stepDone(d,i){
  if(i===0) return !!(d.names&&d.type&&d.date&&d.start&&d.venue);
  if(i===1) return d.genres.length>0;
  if(i===2) return d.must.length>0||okUrl(d.playlist);
  if(i===3) return d.timeline.length>0;
  return false;
}
function deadline(d){ // last day the client can still edit
  if(!S.lockDays||!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')) return null;
  const end=new Date(d.date+'T00:00:00');end.setDate(end.getDate()-S.lockDays-1);
  const today=new Date();today.setHours(0,0,0,0);
  return {days:Math.round((end-today)/864e5),label:String(end.getDate()).padStart(2,'0')+'.'+String(end.getMonth()+1).padStart(2,'0')};
}

const S={mode:'landing',view:'list',key:null,token:null,dj:null,brand:null,events:[],ev:null,step:0,locked:false,save:'',results:{},q:{},wake:null};
let saveTimer=null,dirty=false,saving=false,boothTimer=null;
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function merge3(base,local,remote){ // keep my changed fields, take theirs for the rest
  const out=clone(remote||{}),keys=new Set([...Object.keys(local||{}),...Object.keys(base||{})]);
  keys.forEach(k=>{if(!same(local[k],(base||{})[k])){if(local[k]===undefined)delete out[k];else out[k]=clone(local[k])}});
  return norm(out);
}
function synced(data,rev){S.base=clone(data);S.rev=rev;S.syncedAt=Date.now();S.offline=false;cacheNow()}
function cacheNow(){
  if(S.mode==='admin'&&S.dj) ls.set('dj_cache',JSON.stringify({dj:S.dj,events:S.events,at:Date.now()}));
  else if(S.mode==='client'&&S.ev) ls.set('ev_'+S.token,JSON.stringify({brand:S.brand,data:S.ev.data,rev:S.rev,locked:S.locked,at:Date.now()}));
}
const busyTyping=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};

  const lum=(0.299*r+0.587*g+0.114*b)/255;

function tlKey(t,start){ // events run past midnight: early-morning times sort after evening ones
  let m=mins(t);if(m==null) return 99999;
  const s=mins(start);const pivot=s!=null?s:mins((S.ev&&S.ev.data.timeline[0]||{}).time);
  if(pivot!=null&&pivot>=600&&m<pivot-120) m+=1440;

/* ---------- saving ---------- */
function setSave(s){S.save=s;const e=$('.savestate');if(e){e.textContent=s==='saving'?'שומר…':s==='saved'?'נשמר':s==='err'?'אין חיבור, ננסה שוב':'';e.classList.toggle('err',s==='err')}}
function touch(){
  if(S.locked&&S.mode==='client') return;
  dirty=true;setSave('saving');clearTimeout(saveTimer);saveTimer=setTimeout(flush,800);
}
async function flush(){
  if(!dirty||!S.ev) return;
  if(saving){saveTimer=setTimeout(flush,400);return}
  saving=true;dirty=false;
  const sent=clone(S.ev.data);
  try{
    let res,remote,rev;
    if(S.mode==='client'){
      res=await rpc('client_save',{p_token:S.token,p_data:sent,p_base:S.rev||null});
      if(res.conflict){remote=res.data;rev=res.updated_at}
    }else{
      res=await rpc('dj_save_event',{p_key:S.key,p_id:S.ev.id,p_data:sent,p_notes:S.ev.dj_notes||'',p_locked:!!S.ev.locked,p_lock_days:+S.ev.lock_days||0,p_base:S.rev||null});
      if(res.conflict){remote=res.event.data;rev=res.event.updated_at}
      else{S.ev.is_locked=res.is_locked;S.ev.updated_at=res.updated_at}
    }
    if(remote){ // the other side saved first: merge field by field, then save again
      S.ev.data=merge3(S.base,S.ev.data,norm(remote));S.base=clone(norm(remote));S.rev=rev;dirty=true;
      if(!busyTyping()) render();
      toast('התקבל עדכון מהצד השני, מיזגנו את השינויים');
      saving=false;return flush();
    }
    synced(sent,res.updated_at);
    if(!dirty) setSave('saved');
  }catch(err){
    if(err.message==='locked'){S.locked=true;render();toast('הטופס ננעל לעריכה')}
    else{dirty=true;setSave('err');saveTimer=setTimeout(flush,4000)}
  }
  saving=false;
}
/* pull the other side's changes while this side is idle */
async function pull(){
  if(!S.ev||dirty||saving||document.hidden) return;
  if(S.mode==='admin'&&S.view!=='event'&&S.view!=='booth') return;
  if(S.mode!=='admin'&&S.mode!=='client') return;
  try{
    let data,rev,extra=null;
    if(S.mode==='client'){const r=await rpc('client_get',{p_token:S.token});data=r.data;rev=r.updated_at;extra=r}
    else{const e=await rpc('dj_get_event',{p_key:S.key,p_id:S.ev.id});data=e.data;rev=e.updated_at;extra=e}
    if(dirty||saving) return;
    S.syncedAt=Date.now();S.offline=false;
    const lockNow=S.mode==='client'?extra.is_locked:S.locked;
    if(rev===S.rev&&lockNow===S.locked){if(S.mode==='admin'&&extra.review&&!same(extra.review,S.ev.review)){S.ev.review=extra.review;if(!busyTyping()&&S.view==='event')render()}return}
    if(busyTyping()&&S.view!=='booth') return; // try again next round
    S.ev.data=norm(data);S.base=clone(S.ev.data);S.rev=rev;
    if(S.mode==='client'){S.locked=extra.is_locked;S.lockDays=extra.lock_days||0}
    else Object.assign(S.ev,{review:extra.review,client_updated_at:extra.client_updated_at,client_seen_at:extra.client_seen_at,is_locked:extra.is_locked,updated_at:extra.updated_at});
    cacheNow();render();
  }catch(_){S.offline=true}
}
setInterval(pull,15000);
window.addEventListener('beforeunload',e=>{if(dirty){flush();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(dirty){clearTimeout(saveTimer);flush()}return}
  pull();
  if(S.view==='booth'&&navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>S.wake=w).catch(()=>{});
});

async function boot(){
  const m=/^\/(e|r)\/([A-Za-z0-9]{16,64})\/?$/.exec(location.pathname)||/[?&](e|r)=([A-Za-z0-9]{16,64})(?:&|$)/.exec(location.search);
  const pm=/[?&]d=([A-Za-z0-9_-]{6,40})(?:&|$)/.exec(location.search);
  if(pm&&!m){
    S.mode='profile';
    try{const r=await rpc('dj_public',{p_slug:pm[1]});S.brand=r.brand;S.reviews=r.reviews||[];setAccent(r.brand.accent);document.title=(r.brand.brand_name||'DJ')+' | ביקורות';render()}
    catch(e){app.innerHTML='<div class="wrap"><div class="hero"><h1>הדף לא נמצא</h1><p>ייתכן שהקישור הועתק חלקית.</p></div></div>'}
    return;
  }
  if(m){
    S.mode=m[1]==='r'?'review':'client';S.token=m[2];
    try{
      const r=await rpc('client_get',{p_token:S.token});
      S.brand=r.brand;S.locked=r.is_locked;S.lockDays=r.lock_days||0;S.demo=!!r.is_demo;S.ev={data:norm(r.data),review:r.review};setAccent(r.brand.accent);
      if(S.mode==='review'){S.rv={stars:(r.review&&r.review.stars)||0,done:false};document.title=(r.brand.brand_name||'DJ')+' | איך היה?';render();return}
      document.title=(r.brand.brand_name||'DJ')+' | פרטי האירוע';
      if(S.ev.data.submitted) S.step=4;
      synced(S.ev.data,r.updated_at);
    }catch(e){
      const c=e.message!=='not found'&&JSON.parse(ls.get('ev_'+S.token)||'null');
      if(c&&S.mode==='client'){S.brand=c.brand;S.locked=c.locked;S.ev={data:norm(c.data)};S.base=clone(S.ev.data);S.rev=c.rev;S.offline=true;S.syncedAt=c.at;setAccent(c.brand.accent);render();return}
      app.innerHTML='<div class="wrap"><div class="hero"><h1>הקישור לא נמצא</h1><p>ייתכן שהקישור הועתק חלקית. בקשו מה-DJ לשלוח אותו שוב.</p></div></div>';return}
    render();return;
  }
  const h=/[#&]k=([A-Za-z0-9]{20,64})/.exec(location.hash);
  if(h){ls.set('djkey',h[1]);history.replaceState(null,'',BASE)}
  S.key=ls.get('djkey');
  if(new URLSearchParams(location.search).has('l')){S.mode='landing';render();return}
  if(!S.key){S.mode='landing';render();return}
  S.mode='admin';
  try{await loadAdmin()}catch(e){
    const c=e.message!=='unauthorized'&&JSON.parse(ls.get('dj_cache')||'null');
    if(e.message==='unauthorized'){ls.del('djkey');S.mode='landing';S.badKey=true}
    else if(c){S.dj=c.dj;S.brand=c.dj;S.events=c.events.map(x=>(x.data=norm(x.data),x));S.trash=[];S.offline=true;S.syncedAt=c.at;setAccent(c.dj.accent)}
    else{app.innerHTML='<div class="wrap"><div class="hero"><h1>אין חיבור</h1><p>בדקו את החיבור לאינטרנט ורעננו את הדף.</p></div></div>';return}
  }
  render();
}

let songTimer=null;
function searchSongs(k,q){

function wrapText(ctx,text,maxW){
  const out=[];
  String(text).split(/\n+/).forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line)});
  return out;
}
async function storyImage(){
  const r=S.ev.review,b=S.dj;if(!r) return;
  try{await document.fonts.load('700 120px Karantina');await document.fonts.load('500 56px "IBM Plex Sans Hebrew"')}catch(_){ }
  const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
  x.fillStyle='#17132B';x.fillRect(0,0,1080,1920);
  x.textAlign='center';x.direction='rtl';
  x.font='120px serif';x.direction='ltr';
  x.fillStyle='#3A3360';x.fillText('★★★★★',540,470);
  x.fillStyle='#FFB020';const full='★★★★★',fw=x.measureText(full).width,pw=x.measureText('★'.repeat(r.stars)).width;
  x.textAlign='left';x.fillText('★'.repeat(r.stars),540-fw/2,470);x.textAlign='center';
  x.direction='rtl';x.fillStyle='#FFFFFF';
  let size=64,lines;
  do{x.font='500 '+size+'px "IBM Plex Sans Hebrew", sans-serif';lines=wrapText(x,r.text||'',860);size-=4}while(lines.length*(size+4)*1.45>820&&size>30);
  const lh=(size+4)*1.45;let y=640+(820-lines.length*lh)/2;
  lines.forEach(l=>{x.fillText(l,540,y);y+=lh});
  if(r.name){x.font='700 96px Karantina, sans-serif';x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#FF3D6E';x.fillText(r.name,540,1560)}
  x.fillStyle='#A9A2C9';x.font='700 72px Karantina, sans-serif';x.direction='ltr';
  if(b.logo){await new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(360/im.width,150/im.height);x.drawImage(im,540-im.width*k/2,1680,im.width*k,im.height*k);res()};im.onerror=res;im.src=b.logo})}
  else x.fillText(b.brand_name||'',540,1770);
  c.toBlob(async blob=>{
    const file=new File([blob],'review-story.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(_){ }}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='review-story.png';a.click();
  },'image/png');
}

function nowIdx(d){
  const n=new Date(),cur=n.getHours()*60+n.getMinutes();
  const ck=tlKey(hhmm(cur),d.start);let idx=-1;
  d.timeline.forEach((r,i)=>{if(tlKey(r.time,d.start)<=ck) idx=i});
  return idx;
}
function renderBooth(){
  const draw=()=>{
    const e=S.ev,d=e.data,n=new Date(),idx=nowIdx(d),ms=Object.entries(d.moments).filter(x=>x[1]);
    app.innerHTML='<div class="booth"><div class="bh"><div><div class="bn" dir="auto">'+esc(d.names||'אירוע')+'</div>'+(d.pron?'<div class="bm" dir="auto">הגייה: '+esc(d.pron)+'</div>':'')+'<div class="bm">'+esc([d.type,d.venue,d.guests?d.guests+' מוזמנים':''].filter(Boolean).join(', '))+'</div><div class="bm">'+(S.offline?'אין חיבור. ':'')+'סונכרן לאחרונה '+clock(S.syncedAt||Date.now())+'</div></div>'+
    '<div style="display:flex;gap:16px;align-items:center"><div class="clock">'+hhmm(n.getHours()*60+n.getMinutes())+'</div><button class="btn sm" data-act="boothexit">יציאה</button></div></div>'+
    '<div class="grid"><div><h4>ציר זמן</h4><ol class="bt">'+(d.timeline.length?d.timeline.map((r,i)=>'<li class="'+(i===idx?'now':i<idx?'past':'')+'"><span class="tm">'+esc(r.time||'')+'</span><span class="tt" dir="auto">'+esc(r.title||'')+(r.note?'<span class="tn" dir="auto">'+esc(r.note)+'</span>':'')+'</span></li>').join(''):'<li><span></span><span class="tn">אין ציר זמן לאירוע הזה.</span></li>')+'</ol>'+
    (ms.length?'<h4>רגעים מיוחדים</h4><ul class="bl">'+ms.map(m=>'<li><small>'+esc(m[0])+'</small><span dir="auto">'+esc(m[1])+'</span></li>').join('')+'</ul>':'')+'</div>'+
    '<div><h4>חובה לנגן ('+d.must.length+')</h4><ul class="bl">'+d.must.map(s=>'<li><span dir="auto">'+esc(s.t)+'</span>'+(s.a?'<small dir="auto">'+esc(s.a)+'</small>':'')+'</li>').join('')+'</ul>'+
    (d.nice.length?'<h4>נחמד שיהיה ('+d.nice.length+')</h4><ul class="bl">'+d.nice.map(s=>'<li><span dir="auto">'+esc(s.t)+'</span>'+(s.a?'<small dir="auto">'+esc(s.a)+'</small>':'')+'</li>').join('')+'</ul>':'')+
    (okUrl(d.playlist)?'<h4>פלייליסט של הלקוח</h4><div><a style="color:#fff" href="'+esc(d.playlist)+'" target="_blank" rel="noopener">פתיחה</a></div>':'')+
    '<h4>לא לנגן ('+d.no.length+')</h4><ul class="bl no">'+d.no.map(s=>'<li><span dir="auto">'+esc(s.t)+'</span>'+(s.a?'<small dir="auto">'+esc(s.a)+'</small>':'')+'</li>').join('')+'</ul>'+
    (d.genres.length?'<h4>סגנונות</h4><div>'+esc(d.genres.join(', '))+'</div>':'')+
    (d.vibe?'<h4>הרחבה</h4><div class="notes" dir="auto">'+esc(d.vibe)+'</div>':'')+
    (d.notes?'<h4>הערות הלקוח</h4><div class="notes" dir="auto">'+esc(d.notes)+'</div>':'')+
    (e.dj_notes?'<h4>הערות פרטיות</h4><div class="notes" dir="auto">'+esc(e.dj_notes)+'</div>':'')+'</div></div></div>';
  };
  draw();boothTimer=setInterval(draw,20000);
  if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>S.wake=w).catch(()=>{});
}

/* ---------- pdf ---------- */
function printDoc(){
  const d=S.ev.data,admin=S.mode==='admin',kv=[['סוג האירוע',d.type],['תאריך',fmtDate(d.date)],['שעות',[d.start,d.end].filter(Boolean).join(' עד ')],['מקום',[d.venue,d.city].filter(Boolean).join(', ')],['מוזמנים',d.guests],['הגייה',d.pron],['איש קשר',[d.contact_name,d.contact_phone?'⁦'+d.contact_phone+'⁩':''].filter(Boolean).join(' ')]].filter(x=>x[1]);
  const ms=Object.entries(d.moments).filter(x=>x[1]);
  const song=s=>'<li><bdi>'+esc(s.t)+'</bdi>'+(s.a?', <bdi>'+esc(s.a)+'</bdi>':'')+'</li>';
  $('#print').innerHTML='<div class="ph">'+brandHTML(S.brand)+'<div>סיכום אירוע</div></div>'+
  '<h1 dir="auto">'+esc(d.names||'אירוע')+'</h1>'+
  '<div class="kv">'+kv.map(x=>'<div><b>'+x[0]+':</b> '+esc(x[1])+'</div>').join('')+'</div>'+
  (d.timeline.length?'<h2>ציר זמן</h2><table>'+d.timeline.map(r=>'<tr><td class="tm">'+esc(r.time||'')+'</td><td><b dir="auto">'+esc(r.title||'')+'</b>'+(r.note?'<div dir="auto">'+esc(r.note)+'</div>':'')+'</td></tr>').join('')+'</table>':'')+
  (d.genres.length?'<h2>סגנונות מוזיקה</h2><div>'+esc(d.genres.join(', '))+'</div>':'')+
  (d.vibe?'<div class="pre" dir="auto" style="margin-top:6px">'+esc(d.vibe)+'</div>':'')+
  (ms.length?'<h2>רגעים מיוחדים</h2><table>'+ms.map(m=>'<tr><td style="width:40%">'+esc(m[0])+'</td><td dir="auto">'+esc(m[1])+'</td></tr>').join('')+'</table>':'')+
  (d.must.length?'<h2>חובה לנגן</h2><ol>'+d.must.map(song).join('')+'</ol>':'')+
  (d.nice.length?'<h2>נחמד שיהיה</h2><ul>'+d.nice.map(song).join('')+'</ul>':'')+
  (okUrl(d.playlist)?'<h2>פלייליסט</h2><div dir="ltr" style="text-align:left;word-break:break-all">'+esc(d.playlist)+'</div>':'')+
  (d.no.length?'<h2>לא לנגן</h2><ul>'+d.no.map(song).join('')+'</ul>':'')+
  (d.notes?'<h2>הערות ובקשות</h2><div class="pre" dir="auto">'+esc(d.notes)+'</div>':'')+
  (admin&&S.ev.dj_notes?'<h2>הערות פרטיות</h2><div class="pre" dir="auto">'+esc(S.ev.dj_notes)+'</div>':'')+
  '<div class="foot">הופק בתאריך '+fmtDate(new Date().toISOString().slice(0,10))+'</div>';
  const t=document.title;document.title=(d.names||'אירוע')+(d.date?' '+fmtDate(d.date):'');
  setTimeout(()=>{window.print();document.title=t},150);
}

/* ---------- events ---------- */
app.addEventListener('input',e=>{
  const t=e.target,ev=S.ev;
  if(t.dataset.song!==undefined){searchSongs(t.dataset.song,t.value);return}
  if(!ev) return;
  if(t.dataset.k){ev.data[t.dataset.k]=t.type==='number'?(t.value===''?'':+t.value):t.value;touch()}
  else if(t.dataset.m){ev.data.moments[t.dataset.m]=t.value;touch()}
  else if(t.dataset.tl!==undefined){ev.data.timeline[+t.dataset.tl][t.dataset.f]=t.value;touch()}
  else if(t.dataset.ev){ev[t.dataset.ev]=t.type==='checkbox'?t.checked:t.dataset.ev==='lock_days'?+t.value:t.value;touch()}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ev&&S.ev){S.ev[t.dataset.ev]=t.type==='checkbox'?t.checked:t.dataset.ev==='lock_days'?+t.value:t.value;touch()}
  if(t.id==='s_logo'&&t.files[0]) readLogo(t.files[0]);
});
app.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset.song!==undefined){e.preventDefault();const q=t.value.trim();if(q)addSong(t.dataset.song,{t:q,a:''})}
});
function readLogo(file){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const k=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let u=c.toDataURL('image/png');if(u.length>300000)u=c.toDataURL('image/webp',.85);if(u.length>380000)u=c.toDataURL('image/jpeg',.8);
    S.dj.logo=u;S.pendingLogo=true;toast('הלוגו נטען. לחצו על שמירת הגדרות');URL.revokeObjectURL(url);
  };
  img.onerror=()=>toast('לא הצלחנו לקרוא את הקובץ. נסו תמונה אחרת');
  img.src=url;
}
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  const a=b.dataset.act,ev=S.ev,d=ev&&ev.data;
  switch(a){
    case 'step':await flush();S.step=+b.dataset.i;render();scrollTo(0,0);break;
    case 'next':S.step++;render();scrollTo(0,0);break;
    case 'prev':S.step--;render();scrollTo(0,0);break;
    case 'type':d.type=b.dataset.v;touch();render();break;
    case 'genre':{const v=b.dataset.v,i=d.genres.indexOf(v);if(i<0)d.genres.push(v);else d.genres.splice(i,1);touch();b.classList.toggle('on');b.setAttribute('aria-pressed',i<0);break}
    case 'songpick':addSong(b.dataset.k,S.results[b.dataset.k][+b.dataset.i]);break;
    case 'songfree':addSong(b.dataset.k,{t:(S.q[b.dataset.k]||'').trim(),a:''});break;
    case 'songdel':d[b.dataset.k].splice(+b.dataset.i,1);touch();render();break;
    case 'tladd':{const last=d.timeline[d.timeline.length-1],lm=last&&mins(last.time);d.timeline.push({time:lm!=null?hhmm(lm+30):(d.start||''),title:'',note:''});touch();render();const ins=document.querySelectorAll('.tl .ti');if(ins.length)ins[ins.length-1].focus();break}
    case 'tldel':d.timeline.splice(+b.dataset.i,1);touch();render();break;
    case 'tlsort':sortTl(d);touch();render();break;
    case 'tlplan':{
      if(d.timeline.length&&!confirm('להחליף את ציר הזמן הקיים בציר מוצע?')) break;
      const s=mins(d.start),p=PLAN[d.type]||PLAN._;let en=mins(d.end);
      d.timeline=p.map(x=>({time:hhmm(s+x[0]),title:x[1],note:''}));
      if(en!=null){if(en<=s)en+=1440;d.timeline=d.timeline.filter(r=>tlKey(r.time,d.start)<en);d.timeline.push({time:hhmm(en),title:'סיום',note:''})}
      touch();render();break}
    case 'join':{
      const n=$('#j_name').value.trim(),p=$('#j_phone').value.trim(),br=$('#j_brand').value.trim();
      if(n.length<2){toast('חסר שם');break}
      if(p.replace(/[^0-9]/g,'').length<9){toast('מספר הטלפון לא נראה תקין');break}
      b.disabled=true;
      try{await rpc('join_request',{p_name:n,p_phone:p,p_brand:br});S.joined=true;render();const j=$('#join');j&&j.scrollIntoView({block:'center'})}
      catch(err){b.disabled=false;toast(err.message==='bad_phone'?'מספר הטלפון לא נראה תקין':'השליחה נכשלה. בדקו את החיבור ונסו שוב')}
      break}
    case 'submit':if(S.demo){toast('באירוע אמיתי הפרטים היו נשלחים עכשיו ל-DJ');break}d.submitted=true;d.submitted_at=new Date().toISOString();dirty=true;await flush();render();toast('נשלח. תודה!');break;
    case 'pdf':printDoc();break;
    case 'star':S.rv.text=$('#r_text').value;S.rv.name=$('#r_name').value;S.rv.stars=+b.dataset.i;render();break;
    case 'sendreview':{
      if(!S.rv.stars){toast('בחרו כמה כוכבים קודם');break}
      b.disabled=true;
      try{await rpc('client_review',{p_token:S.token,p_stars:S.rv.stars,p_text:$('#r_text').value.trim(),p_name:$('#r_name').value.trim()});S.rv.done=true;render()}catch(_){b.disabled=false;toast('השליחה נכשלה. בדקו את החיבור ונסו שוב')}
      break}
    case 'story':storyImage();break;
    case 'copyreview':await copy((ev.review.text||'')+(ev.review.name?'\n'+ev.review.name:''));toast('התגובה הועתקה');break;
    case 'copyreviewlink':await copy(pubLink('r',ev.token));toast('הקישור הועתק');break;
    case 'askreview':{
      const nm=d.names?' '+d.names:'',br=S.dj.brand_name||'ה-DJ';
      window.open('https://wa.me/'+waPhone(d.contact_phone)+'?text='+encodeURIComponent('היי'+nm+', כאן '+br+'. היה כיף גדול באירוע שלכם! אשמח אם תדרגו ותכתבו כמה מילים, זה לוקח חצי דקה:\n'+pubLink('r',ev.token)),'_blank','noopener');break}
    /* admin */
    case 'new':{b.disabled=true;try{const n=await rpc('dj_create_event',{p_key:S.key,p_data:{}});n.data=norm(n.data);S.events.unshift(n);S.ev=n;S.step=0;S.view='event';S.save='';synced(n.data,n.updated_at);render();scrollTo(0,0)}catch(_){toast('לא הצלחנו ליצור אירוע. בדקו את החיבור');b.disabled=false}break}
    case 'open':S.ev=S.events.find(x=>x.id===b.dataset.id);S.step=0;S.view='event';S.save='';S.q={};S.results={};S.base=clone(S.ev.data);S.rev=S.ev.updated_at;render();scrollTo(0,0);pull();break;
    case 'back':await flush();S.view='list';try{await loadAdmin()}catch(_){ }render();break;
    case 'settings':S.view='settings';render();break;
    case 'copylink':await copy(clientLink(ev.token));toast('הקישור הועתק');break;
    case 'copyprofile':await copy(profLink(S.dj.slug));toast('הקישור לדף הביקורות הועתק');break;
    case 'revpub':{const on=b.checked;try{await rpc('dj_review_public',{p_key:S.key,p_id:ev.id,p_public:on});ev.review_public=on;toast(on?'הביקורת מוצגת בדף':'הביקורת הוסרה מהדף')}catch(_){b.checked=!on;toast('השמירה נכשלה. נסו שוב')}break}
    case 'copyadmin':await copy(location.origin+BASE+'#k='+S.key);toast('קישור הניהול הועתק');break;
    case 'wa':case 'remind':{
      const link=clientLink(ev.token),nm=d.names?' '+d.names:'',br=S.dj.brand_name||'ה-DJ';
      const txt=a==='wa'?'היי'+nm+', כאן '+br+'. כדי שאגיע מוכן לאירוע שלכם, מלאו בבקשה את הפרטים בקישור. זה לוקח כמה דקות ואפשר לעדכן בכל שלב:\n'+link:'היי'+nm+', תזכורת קטנה מ'+br+' להשלים את פרטי האירוע בקישור:\n'+link;
      window.open('https://wa.me/'+waPhone(d.contact_phone)+'?text='+encodeURIComponent(txt),'_blank','noopener');break}
    case 'booth':await flush();S.view='booth';render();break;
    case 'boothexit':if(S.wake){S.wake.release().catch(()=>{});S.wake=null}S.view='event';render();break;
    case 'del':if(confirm('למחוק את האירוע? אפשר לשחזר אותו במשך 30 יום מרשימת האירועים.')){try{await rpc('dj_delete_event',{p_key:S.key,p_id:ev.id});dirty=false;S.ev=null;S.view='list';try{await loadAdmin()}catch(_){ }render();toast('האירוע נמחק. אפשר לשחזר מרשימת האירועים')}catch(_){toast('המחיקה נכשלה. נסו שוב')}}break;
    case 'restore':b.disabled=true;try{await rpc('dj_restore_event',{p_key:S.key,p_id:b.dataset.id});await loadAdmin();render();toast('האירוע שוחזר')}catch(_){b.disabled=false;toast('השחזור נכשל. נסו שוב')}break;
    case 'rmlogo':S.dj.logo=null;render();toast('לחצו על שמירת הגדרות כדי לסיים');break;
    case 'savesettings':{
      const nb=$('#s_brand').value.trim(),np=$('#s_phone').value.trim(),na=$('#s_accent').value;
      try{await rpc('dj_update_profile',{p_key:S.key,p_brand:nb,p_logo:S.dj.logo||null,p_accent:na,p_phone:np});S.dj.brand_name=nb;S.dj.phone=np;S.dj.accent=na;setAccent(na);render();toast('ההגדרות נשמרו')}catch(_){toast('השמירה נכשלה. נסו לוגו קטן יותר')}
      break}
  }
});
boot();
</script>
